# Redis config for CompileX horizontal scaling (pub/sub fan-out).
# The Yjs documents live in Postgres, so Redis here is a transient message bus —
# persistence is optional and kept light.

# ── Security ────────────────────────────────────────────────────────────────
# In production, set a password and pass it in REDIS_URL (redis://:PASS@host:6379).
# Uncomment and set via an env-substituted config or `--requirepass` at runtime:
# requirepass CHANGE_ME_STRONG_PASSWORD
protected-mode yes

# ── Networking ──────────────────────────────────────────────────────────────
tcp-keepalive 60
timeout 0

# ── Memory safety (bus should never OOM the box) ────────────────────────────
maxmemory 256mb
maxmemory-policy allkeys-lru

# ── Persistence (transient bus → minimal) ───────────────────────────────────
appendonly no
save ""
