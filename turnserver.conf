# coturn — TURN/STUN relay for the WebRTC voice mesh.
# Needed only for peers behind restrictive/symmetric NATs (corporate, some mobile)
# where a direct P2P path can't be found. The backend hands browsers EPHEMERAL,
# time-limited credentials (see src/controllers/voiceController.js) computed from
# static-auth-secret below — no long-lived password ever ships to the client.
#
# Run: docker compose up coturn   (or the whole stack)
# The backend must set the SAME secret in TURN_SECRET and advertise the relay via
#   TURN_URLS=turn:<PUBLIC_HOST>:3478?transport=udp,turn:<PUBLIC_HOST>:3478?transport=tcp

# Listening ports
listening-port=3478
# tls-listening-port=5349          # enable with certs for turns:// (TLS)

# REST-API / time-limited credentials (coturn "TURN REST API").
use-auth-secret
static-auth-secret=CHANGE_ME_SAME_AS_BACKEND_TURN_SECRET

# Realm — any stable string (typically your domain).
realm=compilex.local

# Relay range — open these UDP ports on the host/firewall for media.
min-port=49152
max-port=49252

# Only relay, don't be an open proxy. Deny relaying to private/loopback ranges.
no-multicast-peers
no-cli
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
allowed-peer-ip=0.0.0.0-255.255.255.255

# In production set the server's PUBLIC IP so relayed candidates are reachable:
# external-ip=YOUR.PUBLIC.IP.ADDR
fingerprint
stale-nonce=600
