# nginx load balancer for CompileX backend instances.
# WebSocket-aware (Yjs /collab + Socket.IO). No sticky sessions: all instances
# share room state via Redis, so any user may land on any instance.
events { worker_connections 4096; }

http {
  upstream compilex_backend {
    least_conn;                 # even distribution; Redis keeps rooms in sync
    server backend1:5001 max_fails=3 fail_timeout=10s;
    server backend2:5001 max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  # WebSocket upgrade plumbing.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    # Long timeouts so idle collaborative WebSockets aren't cut.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
      proxy_pass http://compilex_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fast health path for the LB itself.
    location = /lb-health { return 200 'ok'; add_header Content-Type text/plain; }
  }
}
